<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>つきのしらせ</title>
<meta name="theme-color" content="#5cbab7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="つきのしらせ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --teal:#5cbab7; --teal-deep:#3f9f9c; --teal-soft:#d9f0ef; --teal-ring:#8fd0ce;
  --coral:#f2797b; --coral-deep:#e05f62; --coral-soft:#fde4e4;
  --ink:#24343a; --muted:#6b7f84; --line:#e3ecec; --card:#ffffff; --bg:#f4f8f8;
  --ok:#2f8f5b; --warn:#b06d00; --err:#c8414a;
  --f:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-y;overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--teal);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 28px;border-radius:0 0 28px 28px}
.hero .date{font-size:2.1rem;font-weight:700;letter-spacing:.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .date small{font-size:1rem;font-weight:500;margin-left:2px}
.hero .sub{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:600}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.28);font-size:.82rem;font-weight:600}
.ringwrap{display:flex;justify-content:center;margin-top:18px}
.ring{position:relative;width:min(72vw,270px);aspect-ratio:1/1}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:14%;background:#fff;border-radius:50%;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.ring .lab{font-weight:700;font-size:.95rem}
.ring .big{font-size:2.3rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.ring .big small{font-size:.95rem}
.ring .rest{color:var(--muted);font-size:.9rem}
.ring .tag{margin-top:6px;background:var(--coral);color:#fff;border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:700}
.ovu{text-align:center;margin-top:14px;font-weight:600}
.ovu b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.mainbtn{display:block;margin:16px auto 0;border:0;border-radius:999px;background:var(--coral);color:#fff;font-weight:700;font-size:1.15rem;padding:14px 40px;min-width:220px;box-shadow:0 6px 16px rgba(224,95,98,.35);cursor:pointer}
.mainbtn:active{transform:scale(.97)}
.mainbtn.end{background:#fff;color:var(--coral-deep)}
.wrap{padding:16px;display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(30,60,60,.08)}
.card h2{margin:0 0 10px;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--teal-soft);border-radius:14px;padding:10px;text-align:center;min-width:0}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.84rem}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.danger{color:var(--err)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.field{display:grid;gap:6px;min-width:0}
input[type=file],select{max-width:100%}
input[type=file]{width:100%;font-size:14px}
.card,.wrap{min-width:0;max-width:100%}
/* fixed strip behind the iPhone status bar, so scrolled content never shows under the clock */
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--teal);z-index:30;pointer-events:none}
.field label,.lab2{font-weight:600;font-size:.9rem}
input[type=text],input[type=date],input[type=number],textarea{font-size:16px;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;font-size:.9rem;cursor:pointer}
.chip input:checked+span{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-deep);font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px}
.switch input{width:24px;height:24px;accent-color:var(--teal)}
.note{border-radius:12px;padding:10px 12px;font-size:.9rem}
.note.ok{background:#e3f4ea} .note.warn{background:#fdf0d8} .note.err{background:#fde3e4}
.note b{display:block}
.list .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.edit{grid-column:1/-1;background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.dow{text-align:center;font-size:.75rem;color:var(--muted)}
.dow:first-child{color:var(--err)} .dow:last-child{color:#3a7bd5}
.cd{position:relative;aspect-ratio:1/1;border:0;background:none;border-radius:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cd.out{opacity:.35}
.cd.p{background:var(--coral);color:#fff}
.cd.pp{background:var(--coral-soft);color:var(--coral-deep);box-shadow:inset 0 0 0 2px var(--coral)}
.cd.f{background:var(--teal-soft)}
.cd.o{background:var(--teal);color:#fff}
.cd.t{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{outline:3px solid rgba(92,186,183,.6)}
.cd .mk{position:absolute;top:-3px;left:50%;transform:translateX(-50%);font-size:.58rem;line-height:1;padding:2px 4px;border-radius:6px;background:var(--ink);color:#fff;white-space:nowrap;font-weight:700}
.cd .mk.s{background:var(--coral-deep)} .cd .mk.e{background:#7a5a5c}
.cd .devil{position:absolute;top:-6px;right:-4px;width:20px;height:20px;pointer-events:none}
.cd .dot{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.75rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);font-weight:600;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--teal-deep)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,40,40,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow:auto}
.sheet h2{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
.setup{min-height:100vh;background:var(--teal);color:#fff;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px}
.setup .card,.setup .note{color:var(--ink)}
.setup h1{margin:0 0 6px;font-size:1.8rem}
.code{font-size:1.6rem;font-weight:700;letter-spacing:.18em;font-variant-numeric:tabular-nums;user-select:all}
.mono{font-family:ui-monospace,Menlo,monospace;word-break:break-all;user-select:all;background:var(--bg);padding:8px;border-radius:8px;font-size:.85rem}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--teal);color:#fff;font-weight:700}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="sbar" aria-hidden="true"></div>
<div id="root"><div class="loading">読み込み中…</div></div>
<div id="ovRoot"></div>
<div id="toastRoot"></div>
<script>
"use strict";
const API = "https://nkmlmqkakwronvjuziwj.supabase.co/functions/v1/api";
const LS = "tsuki_token";

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const hon = (n) => (/(さん|ちゃん|くん|君|様|さま|たん|氏|ちん)$/.test(n || "") ? n : (n || "") + "さん");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const utc = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const toStr = ms => { const d = new Date(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (s, n) => toStr(utc(s) + n * 864e5);
const diff = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const DOW = "日月火水木金土";
const md = s => { const d = new Date(utc(s)); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const dw = s => DOW[new Date(utc(s)).getUTCDay()];
const fmt = s => s ? `${md(s).replace("/", "月")}日(${dw(s)})` : "";
const fmtY = s => s ? `${s.slice(0, 4)}年${fmt(s)}` : "";
const getToken = () => { try { return localStorage.getItem(LS); } catch (e) { return null; } };
const setToken = t => { try { t ? localStorage.setItem(LS, t) : localStorage.removeItem(LS); } catch (e) {} };
function toast(m) { $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $("#toastRoot").innerHTML = "", 3200); }
async function api(action, data = {}) {
  const h = { "Content-Type": "application/json" };
  const t = getToken(); if (t) h["x-tsuki-token"] = t;
  let res;
  try { res = await fetch(API, { method: "POST", headers: h, body: JSON.stringify({ action, ...data }) }); }
  catch (e) { throw { code: "offline", message: "インターネットにつながっていません。電波の良い所でもう一度お試しください。" }; }
  const j = await res.json().catch(() => ({ ok: false, message: "サーバーの応答を読めませんでした。" }));
  if (!j.ok) throw j;
  if (j.state) S.state = j.state;
  return j;
}
function sheet(html, bind) {
  $("#ovRoot").innerHTML = `<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#ov").addEventListener("click", e => { if (e.target.id === "ov") closeSheet(); });
  bind && bind($("#ov .sheet"));
}
const closeSheet = () => $("#ovRoot").innerHTML = "";
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("コピーしました"); } catch (e) { toast("長押ししてコピーしてください"); } }
function download(name, text, type) {
  const b = new Blob([text], { type }); const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- state ---------- */
const S = { state: null, tab: "home", calY: null, calM: null, sel: null, logDate: null, editing: null };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

/* ---------- push ---------- */
let swReg = null;
async function registerSW() {
  if (!("serviceWorker" in navigator)) return null;
  try { swReg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }); return swReg; } catch (e) { return null; }
}
/* auto-update: when a new version of the app is published, the new service worker takes over and the page reloads once */
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return; // first install: nothing to refresh
    reloading = true; location.reload();
  });
}
function checkUpdate() { try { if (swReg) swReg.update(); } catch (e) {} }
function b64ToU8(b) { const p = "=".repeat((4 - b.length % 4) % 4); const s = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...s].map(c => c.charCodeAt(0))); }
async function pushStatus() {
  if (!pushSupported()) return "unsupported";
  if (Notification.permission === "denied") return "denied";
  const reg = swReg || await navigator.serviceWorker.getRegistration();
  const sub = reg && await reg.pushManager.getSubscription();
  return sub ? "on" : "off";
}
async function enablePush() {
  if (!pushSupported()) {
    if (isIOS && !standalone()) throw { message: "iPhoneでは、ホーム画面に追加したアプリから開いたときだけ通知を使えます。" };
    throw { message: "この端末・ブラウザは通知に対応していません。iPhoneはiOS 16.4以降が必要です。" };
  }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw { message: "通知が許可されませんでした。iPhoneの「設定」→「通知」→「つきのしらせ」で許可できます。" };
  const reg = swReg || await registerSW() || await navigator.serviceWorker.ready;
  const { publicKey } = await api("vapid");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
  await api("subscribe", { subscription: sub.toJSON() });
}
async function localNotify(title, body) {
  // local notification shown by this phone itself (no server)
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const reg = swReg || await navigator.serviceWorker.getRegistration();
    if (reg) await reg.showNotification(title, { body, icon: "icon-192.png", tag: "local-" + Date.now() });
  } catch (e) {}
}

/* cute devil mark for the first day of the PMS window */
const DEVIL = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 14 L5 3 L15 10Z" fill="#8e5bd6"/><path d="M31 14 L35 3 L25 10Z" fill="#8e5bd6"/><circle cx="20" cy="22" r="14" fill="#b58cf0"/><circle cx="20" cy="22" r="14" fill="none" stroke="#7a49c7" stroke-width="1.5"/><path d="M12.5 20 q2.5 -3 5 0" stroke="#3b2266" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M22.5 20 q2.5 -3 5 0" stroke="#3b2266" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M14 26 q6 6 12 0" stroke="#3b2266" stroke-width="2" fill="#fff" stroke-linecap="round"/><circle cx="11.5" cy="25" r="2.2" fill="#f2797b" opacity=".7"/><circle cx="28.5" cy="25" r="2.2" fill="#f2797b" opacity=".7"/></svg>';
// the recorder always sees the PMS start on her own screen; the partner only when notifications to the partner are on
const pmsOn = () => owner() ? true : !!(S.state.partnerView && S.state.partnerView.pmsDays);
const pmsDays = () => { const v = owner() ? S.state.settings.pmsDays : S.state.partnerView && S.state.partnerView.pmsDays; return Math.min(10, Math.max(1, Number(v) || 10)); };

/* ---------- stats helpers (client side, from server state) ---------- */
function owner() { return S.state && S.state.me.role === "owner"; }
const activePartners = () => S.state.members.filter(m => m.role === "partner" && m.status === "active");
const pendingPartners = () => S.state.members.filter(m => m.role === "partner" && m.status === "pending");
function periodEnd(p, st) {
  if (p.end_date) return p.end_date;
  if (st.activeId === p.id) { const t = S.state.today; const e = addDays(p.start_date, st.avgLen - 1); return diff(t, e) > 0 ? t : e; }
  return addDays(p.start_date, st.avgLen - 1);
}
function dayInfo(d) {
  const r = { p: false, pp: false, f: false, o: false, start: false, end: false, pms: false };
  const st = S.state.stats; const t = S.state.today;
  for (const p of S.state.periods) {
    if (p.start_date === d) r.start = true;
    if (p.end_date === d) r.end = true;
    if (diff(p.start_date, d) >= 0 && diff(d, periodEnd(p, st)) >= 0) r.p = true;
  }
  const act = st.activeId && S.state.periods.find(p => p.id === st.activeId);
  if (!r.p && act && diff(t, d) > 0 && diff(d, addDays(act.start_date, st.avgLen - 1)) >= 0) r.pp = true;
  if (!r.p) for (const x of st.predictions) if (diff(x.start, d) >= 0 && diff(d, x.end) >= 0 && diff(t, d) >= 0) r.pp = true;
  if (pmsOn()) for (const x of st.predictions) if (addDays(x.start, -pmsDays()) === d) r.pms = true;
  for (const x of st.predictions) { if (x.ovulation === d) r.o = true; else if (diff(x.fertileStart, d) >= 0 && diff(d, x.fertileEnd) >= 0) r.f = true; }
  return r;
}

/* ---------- render: setup ---------- */
function renderInstall() {
  $("#root").innerHTML = `<div class="setup"><h1>つきのしらせ</h1><p>生理の記録と、パートナーへの通知アプリ</p>
  <div class="card" style="display:grid;gap:10px">
    <h2 style="margin:0">はじめに：ホーム画面に追加してください</h2>
    <p class="small" style="margin:0">iPhoneでは、ホーム画面に追加したアプリからでないと通知が届きません。</p>
    <ol style="margin:0;padding-left:1.2em;display:grid;gap:4px">
      <li>画面下の <b>共有ボタン</b>（四角から上向き矢印）を押す</li>
      <li><b>「ホーム画面に追加」</b>を選ぶ（見当たらなければ下へスクロール）</li>
      <li>右上の<b>「追加」</b>を押す</li>
      <li>ホーム画面にできた <b>つきのしらせ</b> のアイコンから開く</li>
    </ol>
    <p class="small muted" style="margin:0">登録はホーム画面のアプリで行ってください（Safariとアプリでは保存場所が別になります）。</p>
    <button class="btn sm" id="skipInstall">このまま使う（通知なし）</button>
  </div></div>`;
  $("#skipInstall").onclick = () => { S.skipInstall = true; boot(); };
}
function renderSetup() {
  $("#root").innerHTML = `<div class="setup"><h1>つきのしらせ</h1><p>どちらで使いますか？</p>
  <div style="display:grid;gap:12px">
    <form class="card" id="fOwner" style="display:grid;gap:10px">
      <h2 style="margin:0">生理を記録する人</h2>
      <div class="field"><label for="oName">あなたの呼び名（パートナーへの通知に使います）</label><input type="text" id="oName" maxlength="20" placeholder="例：みき" required></div>
      <button class="btn coral" type="submit">記録をはじめる</button>
    </form>
    <form class="card" id="fJoin" style="display:grid;gap:10px">
      <h2 style="margin:0">パートナーとして参加</h2>
      <p class="small muted" style="margin:0">記録する人の「設定」に表示される6文字の招待コードを入力します。</p>
      <div class="field"><label for="jCode">招待コード</label><input type="text" id="jCode" maxlength="8" autocapitalize="characters" placeholder="例：K7Q2XM" required></div>
      <div class="field"><label for="jName">あなたの呼び名</label><input type="text" id="jName" maxlength="20" placeholder="例：けんた" required></div>
      <button class="btn pri" type="submit">参加する</button>
    </form>
    <form class="card" id="fRestore" style="display:grid;gap:10px">
      <h2 style="margin:0">機種変更・再インストールした</h2>
      <div class="field"><label for="rCode">引き継ぎコード</label><input type="text" id="rCode" placeholder="設定画面で発行したコード" required></div>

  </div></div>`;
  const busy = (f, on) => f.querySelector("button").disabled = on;
  $("#fOwner").onsubmit = async e => { e.preventDefault(); busy(e.target, true);
    try { const r = await api("setup_owner", { name: $("#oName").value }); setToken(r.token); await boot(true); }
    catch (er) { toast(er.message); busy(e.target, false); } };
  $("#fJoin").onsubmit = async e => { e.preventDefault(); busy(e.target, true);
    try { const r = await api("join", { code: $("#jCode").value, name: $("#jName").value }); setToken(r.token); await boot(true); }
    catch (er) { toast(er.message); busy(e.target, false); } };
  $("#fRestore").onsubmit = async e => { e.preventDefault(); busy(e.target, true);
    setToken($("#rCode").value.trim());
    try { const r = await api("claim"); setToken(r.token); toast("復元しました。前の携帯は使えなくなりました"); await boot(true); }
    catch (er) { setToken(null); toast(er.message || "復元できませんでした"); busy(e.target, false); } };
}
function renderPushPrompt() {
  const st = S.state; const who = owner() ? "パートナーに知らせる準備ができました" : `${esc(hon(st.partnerView.ownerName))}からの通知を受け取れます`;

  <div class="card" style="display:grid;gap:10px">

    <button class="btn coral" id="pOn">通知をオンにする</button>
    <div id="pMsg"></div>
    <button class="btn sm" id="pLater">あとで設定する</button>
  </div></div>`;
  $("#pOn").onclick = async e => { e.target.disabled = true;

function renderPending() {

/* ---------- render: main ---------- */
const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4z"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
};
function render() {
  if (!S.state) return;
  if (!S.pushAsked && S.justJoined) { S.justJoined = false; return renderPushPrompt(); }
  if (S.state.pending) return renderPending();
  const tabs = owner() ? [["home", "ホーム"], ["calendar", "カレンダー"], ["log", "体調記録"], ["settings", "設定"]]
    : [["home", "ホーム"], ["calendar", "カレンダー"], ["settings", "設定"]];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = "home";
  $("#root").innerHTML = `<div class="app"><div id="view"></div></div>
  <nav class="tabs"><div class="in" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${ICONS[k]}${l}</button>`).join("")}</div></nav>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.editing = null; render(); window.scrollTo(0, 0); });
  const v = $("#view");
  if (S.tab === "home") owner() ? viewHomeOwner(v) : viewHomePartner(v);
  if (S.tab === "calendar") viewCalendar(v);
  if (S.tab === "log") viewLog(v);
  if (S.tab === "settings") owner() ? viewSettingsOwner(v) : viewSettingsPartner(v);
}

function heroHead(t) {
  const st = S.state.stats;
  let cd = null, phase = "";
  if (st && st.lastStart) {
    cd = diff(st.lastStart, t) + 1;
    const ov = st.avgCycle - 14;
    phase = st.activeId ? "生理期" : cd >= ov - 5 && cd <= ov + 1 ? "排卵期" : cd < ov - 5 ? "卵胞期" : "黄体期";
  }
  return `<div class="date">${md(t)}<small>(${dw(t)})</small></div>
    <div class="sub">${cd ? `生理周期${cd}日目` : "記録はまだありません"}${phase ? `<span class="pill">${phase}</span>` : ""}</div>`;
}
function ringSvg(frac) {
  const r = 46, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#8fd0ce" stroke-width="5"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="#f2797b" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function viewHomeOwner(v) {
  const s = S.state, st = s.stats, t = s.today;
  const active = st.activeId ? s.periods.find(p => p.id === st.activeId) : null;
  let center, frac = 0;
  if (active) {
    const d = diff(active.start_date, t) + 1; frac = d / st.avgLen;
    center = `<div class="lab">生理中</div><div class="big">${d}<small>日目</small></div><div class="rest">終わりの目安 ${md(addDays(active.start_date, st.avgLen - 1))}</div>`;
  } else if (st.next) {
    const until = diff(t, st.next); frac = 1 - Math.max(0, until) / st.avgCycle;
    const fert = st.predictions[0] && diff(st.predictions[0].fertileStart, t) >= 0 && diff(t, st.predictions[0].fertileEnd) >= 0;
    center = `<div class="lab">生理予定日</div><div class="big">${md(st.next)}<small>(${dw(st.next)})</small></div>
      <div class="rest">${until >= 0 ? `あと${until}日` : `${-until}日過ぎています`}</div>
      <div class="tag">妊娠可能性：${fert ? "高" : "低"}</div>`;
  } else {
    center = `<div class="lab">生理予定日</div><div class="big" style="font-size:1.4rem">まだ<br>わかりません</div><div class="rest small">生理がきたら<br>下のボタンを押してください</div>`;
  }
  const ovNext = st.predictions.find(x => diff(t, x.ovulation) >= 0) || st.predictions[0];
  const partner = activePartners(), pend = pendingPartners();
  const pState = pend.length ? `<div class="note warn"><b>参加リクエストが届いています</b>${pend.map(m => esc(hon(m.name))).join("、")}が参加を希望しています。「設定」で承認してください。</div>`
    : !partner.length ? `<div class="note warn"><b>パートナーがまだ参加していません</b>「設定」の招待コードをパートナーに伝えてください。</div>`
    : partner.some(m => m.pushDevices > 0) ? `<p class="small muted" style="margin:0">通知先：${partner.map(m => esc(m.name)).join("、")}（通知オン）${s.settings.notifyPartnerStart ? "" : "・開始時の通知はオフ"}</p>`
    : `<div class="note warn"><b>パートナーの通知がオフです</b>${partner.map(m => esc(hon(m.name))).join("、")}のアプリで「通知をオンにする」を押してもらってください。</div>`;
  v.innerHTML = `<section class="hero">${heroHead(t)}
    <div class="ringwrap"><div class="ring">${ringSvg(frac)}<div class="center">${center}</div></div></div>
    ${ovNext && !active ? `<div class="ovu">排卵予定日 <b>${md(ovNext.ovulation)}</b>(${dw(ovNext.ovulation)})</div>` : ""}
    ${active ? `<button class="mainbtn end" id="bEnd">生理が終わった</button>` : `<button class="mainbtn" id="bStart">生理がきた</button>`}
  </section>
  <div class="wrap">
    ${pState}
    <div class="card"><h2>あなたの周期</h2><div class="stats">
      <div class="stat"><b>${st.avgCycle}日</b><span>平均周期${st.cycleSource === "default" ? "（初期値）" : ""}</span></div>
      <div class="stat"><b>${st.avgLen}日</b><span>平均の生理日数${st.lenSource === "default" ? "（初期値）" : ""}</span></div>
      <div class="stat"><b>${s.periods.length}回</b><span>記録した回数</span></div></div></div>
    <div class="card"><h2>今後の生理予定日</h2><div class="list">${st.predictions.length ? st.predictions.map(x => `<div class="it"><div><b>${fmtY(x.start)}</b><div class="small muted">〜${fmt(x.end)}・排卵日の目安 ${fmt(x.ovulation)}${pmsOn() ? `・PMS期間の始まり ${fmt(addDays(x.start, -pmsDays()))}` : ""}</div></div><span class="small muted">あと${Math.max(0, diff(t, x.start))}日</span></div>`).join("") : `<p class="small muted" style="margin:0">記録が1回以上あると表示されます。</p>`}</div>
      <p class="small muted" style="margin:8px 0 0">予定日・排卵日は過去の周期からの目安です。避妊や妊娠の判断には使わないでください。</p></div>
  </div>`;
  const a = $("#bStart"); a && (a.onclick = startFlow);
  const b = $("#bEnd"); b && (b.onclick = () => endFlow(active));
}
function viewHomePartner(v) {
  const s = S.state, pv = s.partnerView, t = s.today;
  let center, frac = 0;
  if (pv.activeSince) {
    const d = diff(pv.activeSince, t) + 1; frac = d / 6;

  } else {

function noticeRow(n) {
  const d = new Date(n.created_at);
  return `<div class="it"><div><b>${esc(n.title)}</b><div class="small muted">${esc(n.body || "")}</div></div><span class="small muted">${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}</span></div>`;
}
async function pushCard(el) {
  const ps = await pushStatus();
  if (ps === "on") { el.innerHTML = ""; return; }
  const msg = ps === "denied" ? "通知がブロックされています。iPhoneの「設定」→「通知」→「つきのしらせ」で許可してください。"
    : ps === "unsupported" ? (isIOS && !standalone() ? "ホーム画面に追加したアプリから開くと、通知を受け取れます。" : "この端末は通知に対応していません（iPhoneはiOS 16.4以降）。")
    : "この携帯の通知がオフです。";
  el.innerHTML = `<div class="note warn"><b>通知を受け取れません</b>${msg}${ps === "off" ? `<div style="margin-top:8px"><button class="btn coral sm" id="pcOn">通知をオンにする</button></div>` : ""}</div>`;
  const b = $("#pcOn", el); b && (b.onclick = async () => { b.disabled = true; try { await enablePush(); toast("通知をオンにしました"); await refresh(); } catch (er) { toast(er.message); b.disabled = false; } });
}

/* ---------- start / end ---------- */
function startFlow() {
  const t = S.state.today, s = S.state, hasPartner = activePartners().length > 0;
  sheet(`<h2>生理がきた</h2>
    <div class="field"><label for="sDate">始まった日</label><input type="date" id="sDate" value="${t}" max="${t}"></div>
    <div class="switch"><label for="sNotify">${hasPartner ? "パートナーに通知する" : "パートナーに通知する（未参加）"}</label><input type="checkbox" id="sNotify" ${hasPartner && s.settings.notifyPartnerStart ? "checked" : ""} ${hasPartner ? "" : "disabled"}></div>
    <div class="row"><button class="btn coral" id="sGo" style="flex:1">記録する</button><button class="btn" id="sNo">やめる</button></div><div id="sOut"></div>`, sh => {
    $("#sNo", sh).onclick = closeSheet;
    $("#sGo", sh).onclick = async e => {
      const btn = e.target; btn.disabled = true; btn.textContent = "記録しています…";
      const date = $("#sDate", sh).value, notify = $("#sNotify", sh).checked;
      try {
        let r;
        try { r = await api("period_start", { date, notify }); }
        catch (er) { if (er.code === "duplicate" && btn.dataset.force) r = await api("period_start", { date, notify, force: true }); else throw er; }
        const sm = r.summary, p = r.push;
        const pushLine = !notify ? "パートナーへの通知は送っていません。"
          : !p ? "パートナーへの通知はオフに設定されています。"
          : p.delivered > 0 ? `パートナーの携帯${p.delivered}台に通知しました。`
          : p.recipients === 0 ? "パートナーがまだ参加していないため、通知できませんでした。"
          : "パートナーの通知がオフのため届きませんでした。パートナーのアプリで通知をオンにしてもらってください。";
        sh.innerHTML = `<h2>記録しました</h2>
          <div class="stats"><div class="stat"><b>${sm.expectedLen}日</b><span>今回の生理の日数（予想）</span></div>
          <div class="stat"><b>${sm.avgCycle}日</b><span>平均の周期${sm.cycleSource === "default" ? "（初期値）" : ""}</span></div>
          <div class="stat"><b>${md(sm.expectedEnd)}</b><span>終わりの目安</span></div></div>
          <p class="small muted" style="margin:0">次回の予定日は ${fmtY(sm.next)} ごろです。</p>
          <div class="note ${p && p.delivered > 0 ? "ok" : notify ? "warn" : "ok"}">${pushLine}</div>
          <button class="btn pri block" id="sClose">閉じる</button>`;
        $("#sClose", sh).onclick = () => { closeSheet(); render(); };
        localNotify("生理を記録しました", `今回の日数の予想は${sm.expectedLen}日、平均周期は${sm.avgCycle}日です。${p && p.delivered > 0 ? "パートナーに通知しました。" : ""}`);
      } catch (er) {
        if (er.code === "duplicate") { $("#sOut", sh).innerHTML = `<div class="note warn"><b>近い日付に記録があります</b>${esc(er.message)} それでも記録する場合は、もう一度「記録する」を押してください。</div>`; btn.dataset.force = "1"; }
        else $("#sOut", sh).innerHTML = `<div class="note err">${esc(er.message)}</div>`;
        btn.disabled = false; btn.textContent = "記録する";
      }
    };
  });
}
function endFlow(active) {
  const t = S.state.today, s = S.state, hasPartner = activePartners().length > 0;
  sheet(`<h2>生理が終わった</h2>
    <div class="field"><label for="eDate">終わった日</label><input type="date" id="eDate" value="${t}" min="${active.start_date}" max="${t}"></div>
    <p class="small muted" style="margin:0">${fmtY(active.start_date)} に始まった生理の終了日として記録します。</p>
    <div class="switch"><label for="eNotify">パートナーにも知らせる</label><input type="checkbox" id="eNotify" ${hasPartner && s.settings.notifyPartnerEnd ? "checked" : ""} ${hasPartner ? "" : "disabled"}></div>
    <div class="row"><button class="btn pri" id="eGo" style="flex:1">記録する</button><button class="btn" id="eNo">やめる</button></div><div id="eOut"></div>`, sh => {
    $("#eNo", sh).onclick = closeSheet;
    $("#eGo", sh).onclick = async e => {
      e.target.disabled = true;
      try {
        const notify = $("#eNotify", sh).checked;
        if (notify && !s.settings.notifyPartnerEnd) await api("settings_save", { settings: { notifyPartnerEnd: true } });
        const r = await api("period_end", { id: active.id, date: $("#eDate", sh).value, notify });

          <div class="stat"><b>${md(sm.next)}</b><span>次回の予定日</span></div></div>
          ${r.push ? `<div class="note ${r.push.delivered ? "ok" : "warn"}">${r.push.delivered ? "パートナーに知らせました。" : "パートナーに届きませんでした（通知がオフの可能性があります）。"}</div>` : ""}
          <button class="btn pri block" id="eClose">閉じる</button>`;
        $("#eClose", sh).onclick = () => { closeSheet(); render(); };
        localNotify("生理の終わりを記録しました", `今回は${sm.length}日間でした。次回の予定日は${fmt(sm.next)}です。`);
      } catch (er) { $("#eOut", sh).innerHTML = `<div class="note err">${esc(er.message)}</div>`; e.target.disabled = false; }
    };
  });
}

/* ---------- calendar ---------- */
function viewCalendar(v) {
  const s = S.state, t = s.today;
  if (S.calY == null) { S.calY = +t.slice(0, 4); S.calM = +t.slice(5, 7) - 1; S.sel = t; }
  const isOwner = owner();
  const first = Date.UTC(S.calY, S.calM, 1), startW = new Date(first).getUTCDay();
  let cells = [..."日月火水木金土"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const ms = first + (i - startW) * 864e5, d = toStr(ms), inM = new Date(ms).getUTCMonth() === S.calM;
    if (i >= 35 && !inM && i % 7 === 0) break;
    const cls = ["cd"]; let mk = "", dot = "";
    if (!inM) cls.push("out");
    if (isOwner) {
      const r = dayInfo(d);
      if (r.p) cls.push("p"); else if (r.pp) cls.push("pp"); else if (r.o) cls.push("o"); else if (r.f) cls.push("f");
      if (r.start) mk = `<span class="mk s">開始</span>`; else if (r.end) mk = `<span class="mk e">終了</span>`;
      if (s.days.some(x => x.date === d)) dot = `<span class="dot"></span>`;
      if (r.pms) dot += `<span class="devil" title="PMS期間の始まり（目安）">${DEVIL}</span>`;
    } else {
      const pv = s.partnerView;
      if (pv.activeSince && diff(pv.activeSince, d) >= 0 && diff(d, t) >= 0) cls.push("p");
      if (pv.activeSince === d) mk = `<span class="mk s">開始</span>`;
      for (const x of pv.predictions || []) if (diff(x.start, d) >= 0 && diff(d, x.end) >= 0 && !cls.includes("p")) cls.push("pp");
      if (pv.pmsDays) for (const x of pv.predictions || []) if (addDays(x.start, -pmsDays()) === d) dot += `<span class="devil" title="PMS期間の始まり（目安）">${DEVIL}</span>`;
    }
    if (d === t) cls.push("t"); if (d === S.sel) cls.push("sel");
    cells += `<button class="${cls.join(" ")}" data-d="${d}" aria-label="${fmtY(d)}">${mk}${+d.slice(8)}${dot}</button>`;
  }
  v.innerHTML = `<section class="hero" style="padding-bottom:18px"><div class="date">${S.calY}年${S.calM + 1}月</div><div class="sub">カレンダー</div></section>
  <div class="wrap"><div class="card">
    <div class="calhead"><button class="btn sm" id="cPrev">‹ 前月</button><button class="btn sm" id="cToday">今日</button><button class="btn sm" id="cNext">次月 ›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:var(--coral)"></i>生理</span><span><i style="background:var(--coral-soft);box-shadow:inset 0 0 0 2px var(--coral)"></i>生理予定</span>
      ${isOwner ? `<span><i style="background:var(--teal-soft)"></i>妊娠しやすい期間（目安）</span><span><i style="background:var(--teal)"></i>排卵日（目安）</span>` : ""}
      <span><i style="background:var(--coral-deep)"></i>開始・終了のマーク</span>

const csv = rows => "﻿" + rows.map(r => r.map(x => { x = String(x ?? ""); return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(",")).join("\r\n");

/* ---------- boot ---------- */
async function refresh() { try { await api("state"); render(); } catch (er) { if (er.code === "unauthorized") { setToken(null); S.state = null; boot(); } else toast(er.message); } }
async function boot(justJoined) {
  await registerSW();
  if (!getToken()) { if (isIOS && !standalone() && !S.skipInstall) return renderInstall(); return renderSetup(); }
  try { await api("state"); }
  catch (er) {
    if (er.code === "unauthorized") { setToken(null); return renderSetup(); }
    $("#root").innerHTML = `<div class="loading" style="flex-direction:column;gap:12px;padding:20px;text-align:center"><div>${esc(er.message || "読み込めませんでした")}</div><button class="btn" id="retry" style="color:var(--ink)">もう一度</button></div>`;
    $("#retry").onclick = () => boot(); return;
  }
  if (justJoined) { const ps = await pushStatus(); S.justJoined = ps !== "on" && ps !== "unsupported"; }
  render();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkUpdate(); if (S.state) refresh(); } });
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "pushed" && S.state) refresh(); });
/* disable pinch zoom (iOS ignores user-scalable=no) */
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
boot();
</script>
</body>
